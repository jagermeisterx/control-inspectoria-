{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión — Inspectoría Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body>
    <div class="login-shell">
        <aside class="login-side">
            <img src="{% static 'img/logo.jpg' %}" alt="Inspectoría Digital">
            <h1>Inspectoría Digital</h1>
            <p>Sistema de Gestión Escolar</p>
        </aside>

        <section class="login-main">
            <div class="login-card">
                <h2>Bienvenido</h2>
                <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

                {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    Usuario o contraseña incorrectos. Intenta nuevamente.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <div class="input-icon-group">
                            <i class="bi bi-person"></i>
                            <input type="text" name="username" class="form-control" placeholder="Tu usuario" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <div class="password-wrap">
                            <div class="input-icon-group">
                                <i class="bi bi-lock"></i>
                                <input id="login-password" type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                            </div>
                            <button type="button" class="password-toggle" data-target="login-password" aria-label="Mostrar contraseña">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                    </button>
                </form>
            </div>
        </section>
    </div>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
