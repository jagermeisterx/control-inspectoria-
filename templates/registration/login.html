{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión — Inspectoría Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold">🏫 Inspectoría Digital</h3>
                <p class="text-muted small">Sistema de Gestión Escolar</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger py-2 small">
                Usuario o contraseña incorrectos. Intenta nuevamente.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Tu usuario" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
