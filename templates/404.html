{% extends "core/base.html" %}
{% block title %}Página no encontrada — Inspectoría Digital{% endblock %}

{% block content %}
<div class="error-hero">
    <div class="error-code">404</div>
    <h1 class="h3 fw-bold mb-2"><i class="bi bi-compass"></i> Página no encontrada</h1>
    <p class="text-muted mb-4">
        La página que buscas no existe, fue movida o la dirección es incorrecta.
    </p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
        <a href="/" class="btn btn-primary"><i class="bi bi-house-door"></i> Ir al inicio</a>
        <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> Volver atrás
        </button>
    </div>
</div>
{% endblock %}
