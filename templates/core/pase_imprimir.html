{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pase de ingreso — {{ atraso.alumno.nombre_completo }}</title>
    <style>
        html, body { height: 100%; margin: 0; background: #e9ecef; }
        #pase { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
        .acciones {
            position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
            display: flex; align-items: center; gap: .5rem; z-index: 10;
            padding: .5rem .6rem; border-radius: .6rem;
            background: rgba(33, 37, 41, .92); box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
        }
        .acciones .ayuda { color: #adb5bd; font-size: .75rem; margin-right: .25rem; }
        .btn {
            border: 0; border-radius: .45rem; padding: .35rem .8rem;
            font-size: .8rem; font-weight: 600; cursor: pointer; text-decoration: none;
        }
        .btn-primario { background: #0d6efd; color: #fff; }
        .btn-primario:hover { background: #0b5ed7; }
        .btn-secundario { background: transparent; color: #f8f9fa; border: 1px solid #6c757d; }
        .btn-secundario:hover { background: rgba(255, 255, 255, .1); }
    </style>
</head>
<body>
    <iframe id="pase" src="{% url 'imprimir_pase' atraso.pk %}"
            title="Pase de autorización de ingreso"></iframe>

    <div class="acciones">
        <span class="ayuda">Si no se abre el diálogo, usa Imprimir</span>
        <button type="button" class="btn btn-primario" onclick="imprimir(false)">Imprimir</button>
        <a class="btn btn-secundario" href="{% url 'imprimir_pase' atraso.pk %}" target="_blank" rel="noopener">Ver pase</a>
    </div>

    <script>
        (function () {
            var frame = document.getElementById('pase');
            var yaImprimio = false;

            function imprimir(cerrar) {
                try {
                    frame.contentWindow.focus();
                    frame.contentWindow.print();
                } catch (e) {
                    // El navegador bloqueó la impresión del iframe: quedan los botones.
                }
                // print() es modal en Chrome y Firefox: al volver, el diálogo ya se cerró.
                if (cerrar) window.close();
            }

            frame.addEventListener('load', function () {
                if (yaImprimio) return;
                yaImprimio = true;
                setTimeout(function () { imprimir(true); }, 400);
            });

            window.imprimir = imprimir;
        })();
    </script>
</body>
</html>
